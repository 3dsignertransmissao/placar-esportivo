<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Placar de Tênis de Mesa</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        
        .scoreboard-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
            box-sizing: border-box;
        }
        
        .category-bar {
            background: #ffcc00;
            color: #000;
            font-weight: bold;
            text-align: center;
            padding: 6px 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        
        .scoreboard-view {
            display: flex;
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            flex-grow: 1; 
        }
        
        .player-row {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
        }
        
        .player-row.left { border-right: 2px solid #444; }
        
        .name { font-size: 22px; font-weight: bold; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sets { font-size: 26px; color: #ffcc00; font-weight: bold; background: #222; padding: 4px 12px; border-radius: 4px; }
        .points { font-size: 42px; font-weight: bold; color: #00ffcc; min-width: 55px; text-align: center; }
        
        .serve-indicator {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            visibility: hidden;
            box-shadow: 0 0 8px #fff;
        }
        .serve-indicator.active { visibility: visible; }
    </style>
</head>
<body>

    <div class="scoreboard-container">
        <div id="view-category" class="category-bar">CAT ABSOLUTO F MASCULINO</div>
        <div class="scoreboard-view">
            <div class="player-row left">
                <div id="view-indicator-1" class="serve-indicator"></div>
                <div id="view-name-1" class="name">Jogador 1</div>
                <div id="view-sets-1" class="sets">0</div>
                <div id="view-points-1" class="points">0</div>
            </div>
            <div class="player-row right">
                <div id="view-points-2" class="points">0</div>
                <div id="view-sets-2" class="sets">0</div>
                <div id="view-name-2" class="name">Jogador 2</div>
                <div id="view-indicator-2" class="serve-indicator"></div>
            </div>
        </div>
    </div>

    <script>
        // Canal de comunicação via Internet / GitHub
        const bc = new BroadcastChannel('tm_global_scoreboard');

        bc.onmessage = (event) => {
            const data = event.data;
            document.getElementById('view-category').innerText = data.category;
            document.getElementById('view-name-1').innerText = data.name1;
            document.getElementById('view-name-2').innerText = data.name2;
            document.getElementById('view-points-1').innerText = data.pts1;
            document.getElementById('view-points-2').innerText = data.pts2;
            document.getElementById('view-sets-1').innerText = data.sets1;
            document.getElementById('view-sets-2').innerText = data.sets2;

            if (data.server === 1) {
                document.getElementById('view-indicator-1').classList.add('active');
                document.getElementById('view-indicator-2').classList.remove('active');
            } else {
                document.getElementById('view-indicator-1').classList.remove('active');
                document.getElementById('view-indicator-2').classList.add('active');
            }
        };
    </script>
</body>
</html>
