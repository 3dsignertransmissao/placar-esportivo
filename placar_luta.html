<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Placar Oficial Estilo UFC / MMA</title>
    <style>
        html, body {
            margin: 0; padding: 0; background: transparent;
            font-family: 'Arial', sans-serif; overflow: hidden;
            width: 100%; height: 100%;
        }
        
        /* Container geral que junta o placar e a tarja de peso */
        .ufc-container {
            width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute; top: 10px; left: 0;
        }

        /* Barra principal longa cinza escuro */
        .fight-scoreboard {
            width: 100%; height: 50px;
            background: #1a1a1a; border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-radius: 4px 4px 0 0; display: flex;
            box-sizing: border-box; color: #ffffff;
        }

        /* Lados dos Lutadores */
        .fighter-side {
            flex: 1; display: flex; align-items: center;
            box-sizing: border-box; padding: 0 15px; font-weight: bold;
        }
        .fighter-side.left { justify-content: flex-start; text-align: left; }
        .fighter-side.right { justify-content: flex-end; text-align: right; flex-direction: row-reverse; }

        /* Nomes nas pontas externas em caixa alta */
        .fighter-name { font-size: 18px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Barra vertical fina com a cor da roupa (lado de dentro) */
        .corner-color {
            width: 15px; height: 100%; transition: background-color 0.2s;
            box-sizing: border-box;
        }
        .left .corner-color { margin-left: auto; border-left: 1px solid #333; }
        .right .corner-color { margin-right: auto; border-right: 1px solid #333; }

        /* Bloco Central: Round e Cronômetro */
        .center-block {
            width: 180px; height: 100%; background: #000000;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; border-left: 1px solid #333; border-right: 1px solid #333;
        }
        .round-display { font-size: 11px; font-weight: bold; color: #ffcc00; text-transform: uppercase; letter-spacing: 1px; margin-bottom: -2px; }
        .timer-display { font-size: 24px; font-weight: bold; font-family: 'Courier New', Courier, monospace; color: #ffffff; }

        /* TARJA MENOR INFERIOR: Exibe a Categoria de Peso (ex: PESO MOSCA) */
        .weight-bar {
            width: auto; min-width: 180px; height: 22px;
            background: rgba(0, 0, 0, 0.85); border: 1px solid #333; border-top: none;
            color: #ffffff; font-size: 11px; font-weight: bold; text-transform: uppercase;
            letter-spacing: 1.5px; display: flex; align-items: center; justify-content: center;
            padding: 0 20px; border-radius: 0 0 4px 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="ufc-container">
        <!-- PLACAR PRINCIPAL -->
        <div class="fight-scoreboard">
            <!-- LUTADOR ESQUERDA -->
            <div class="fighter-side left">
                <div id="view-name-1" class="fighter-name">LUTADOR A</div>
                <div id="view-corner-1" class="corner-color" style="background-color: #000000;"></div>
            </div>

            <!-- CENTRO (ROUND E TEMPO) -->
            <div class="center-block">
                <div id="view-round" class="round-display">ROUND 1</div>
                <div id="view-timer" class="timer-display">05:00</div>
            </div>

            <!-- LUTADOR DIREITA -->
            <div class="fighter-side right">
                <div id="view-name-2" class="fighter-name">LUTADOR B</div>
                <div id="view-corner-2" class="corner-color" style="background-color: #0022cc;"></div>
            </div>
        </div>

        <!-- TARJA DE CATEGORIA INFERIOR -->
        <div id="view-weight" class="weight-bar">PESO MOSCA</div>
    </div>

    <script>
        const bc = new BroadcastChannel('fight_global_scoreboard');

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        bc.onmessage = (event) => {
            const data = event.data;
            
            document.getElementById('view-round').innerText = `ROUND ${data.round}`;
            document.getElementById('view-timer').innerText = formatTime(data.timeLeft);
            document.getElementById('view-weight').innerText = data.weight;
            
            // Atualiza Lutador 1
            document.getElementById('view-name-1').innerText = data.name1;
            document.getElementById('view-corner-1').style.backgroundColor = data.color1;
            
            // Atualiza Lutador 2
            document.getElementById('view-name-2').innerText = data.name2;
            document.getElementById('view-corner-2').style.backgroundColor = data.color2;
        };
    </script>
</body>
</html>
