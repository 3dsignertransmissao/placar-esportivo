<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Placar de Luta Profissional</title>
    <style>
        html, body {
            margin: 0; padding: 0; background: transparent;
            font-family: 'Arial', sans-serif; overflow: hidden;
            width: 100%; height: 100%;
        }
        
        /* Barra longa cinza escuro */
        .fight-scoreboard {
            width: 100%; height: 60px;
            background: #222222; border: 2px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-radius: 4px; display: flex;
            box-sizing: border-box; color: #ffffff;
            position: absolute; top: 10px;
        }

        /* Lados dos Lutadores */
        .fighter-side {
            flex: 1; display: flex; align-items: center;
            box-sizing: border-box; padding: 0 15px; font-weight: bold;
        }
        .fighter-side.left { justify-content: flex-start; text-align: left; }
        .fighter-side.right { justify-content: flex-end; text-align: right; flex-direction: row-reverse; }

        /* Nomes nas pontas externas */
        .fighter-name { font-size: 20px; text-transform: uppercase; text-shadow: 1px 1px 2px #000; }

        /* Barra de cor da roupa (lado de dentro) */
        .corner-color {
            width: 25px; height: 100%; transition: background-color 0.3s;
            box-sizing: border-box; border-left: 1px solid #333; border-right: 1px solid #333;
        }
        .left .corner-color { margin-left: auto; }
        .right .corner-color { margin-right: auto; }

        /* Pontuações em destaque junto à cor */
        .score-box {
            font-size: 26px; font-weight: bold; min-width: 50px; color: #00ffcc;
            height: 100%; display: flex; align-items: center; justify-content: center;
            background: #151515; border-left: 1px solid #333; border-right: 1px solid #333;
        }

        /* Caixa de Faltas/Punições pequena ao lado do ponto */
        .penalty-box {
            font-size: 14px; font-weight: bold; min-width: 28px; color: #cc3333;
            height: 100%; display: flex; align-items: center; justify-content: center;
            background: #1e1111; border-left: 1px solid #333; border-right: 1px solid #333;
        }

        /* Bloco Central: Round e Cronômetro */
        .center-block {
            width: 200px; height: 100%; background: #111111;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; border-left: 2px solid #555; border-right: 2px solid #555;
        }
        .round-display { font-size: 12px; font-weight: bold; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: -2px; }
        .timer-display { font-size: 28px; font-weight: bold; font-family: 'Courier New', Courier, monospace; color: #ffffff; }
    </style>
</head>
<body>

    <div class="fight-scoreboard">
        <!-- LUTADOR ESQUERDA -->
        <div class="fighter-side left">
            <div id="view-name-1" class="fighter-name">LUTADOR A</div>
            <div id="view-penalty-1" class="penalty-box">0</div>
            <div id="view-score-1" class="score-box">0</div>
            <div id="view-corner-1" class="corner-color" style="background-color: #000000;"></div>
        </div>

        <!-- CENTRO (ROUND E TEMPO) -->
        <div class="center-block">
            <div id="view-round" class="round-display">ROUND 1</div>
            <div id="view-timer" class="timer-display">05:00</div>
        </div>

        <!-- LUTADOR DIREITA -->
        <div class="fighter-side right">
            <div id="view-name-2" class="fighter-name">LUTADOR B</div>
            <div id="view-penalty-2" class="penalty-box">0</div>
            <div id="view-score-2" class="score-box">0</div>
            <div id="view-corner-2" class="corner-color" style="background-color: #0022cc;"></div>
        </div>
    </div>

    <script>
        // Canal de comunicação idêntico ao do painel_luta
        const bc = new BroadcastChannel('fight_global_scoreboard');

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        bc.onmessage = (event) => {
            const data = event.data;
            document.getElementById('view-round').innerText = `ROUND ${data.round}`;
            document.getElementById('view-timer').innerText = formatTime(data.timeLeft);
            
            // Lado Esquerdo
            document.getElementById('view-name-1').innerText = data.name1;
            document.getElementById('view-score-1').innerText = data.score1;
            document.getElementById('view-penalty-1').innerText = data.penalty1;
            document.getElementById('view-corner-1').style.backgroundColor = data.color1;
            
            // Lado Direito
            document.getElementById('view-name-2').innerText = data.name2;
            document.getElementById('view-score-2').innerText = data.score2;
            document.getElementById('view-penalty-2').innerText = data.penalty2;
            document.getElementById('view-corner-2').style.backgroundColor = data.color2;
        };
    </script>
</body>
</html>
