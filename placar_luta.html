<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Placar Oficial de MMA / UFC</title>
    <style>
        html, body {
            margin: 0; padding: 0; background: transparent;
            font-family: 'Arial', sans-serif; overflow: hidden;
            width: 100%; height: 100%;
        }
        
        /* Container geral que junta a barra principal e a tarja de peso */
        .ufc-scoreboard {
            width: 100%; display: flex; flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-radius: 4px; overflow: hidden;
            position: absolute; top: 10px;
        }

        /* BARRA PRINCIPAL: Nomes, cores e cronômetro */
        .main-bar {
            height: 50px; background: rgba(34, 34, 34, 0.95); border: 2px solid #333;
    border-bottom: none; display: flex; color: #ffffff;
        }

        /* Lados dos Lutadores - Ajustado para distribuição flexível e simétrica */
        .fighter-side {
            flex: 1; display: flex; align-items: center;
            box-sizing: border-box; position: relative;
        }
        
        /* Garante a inversão de ordem perfeita no lado direito */
        .fighter-side.left { flex-direction: row; }
        .fighter-side.right { flex-direction: row-reverse; }

        /* NOME CENTRALIZADO: Ocupa o espaço restante e centraliza o texto */
        .fighter-name { 
            flex-grow: 1;
            text-align: center;
            font-size: 18px; 
            text-transform: uppercase; 
            font-style: italic; 
            text-shadow: 1px 1px 2px #000;
            font-weight: bold;
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap;
            padding: 0 15px; /* Evita que o nome cole nas bordas ou na cor */
        }

        /* Barra de cor da roupa (sempre do lado de dentro, colada no cronômetro) */
        .corner-color {
            width: 25px; height: 100%; transition: background-color 0.3s;
            box-sizing: border-box; border-left: 1px solid #333; border-right: 1px solid #333;
            flex-shrink: 0;
        }

        /* Bloco Central: Round e Cronômetro */
        .center-block {
            width: 160px; height: 100%; background: #111111;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; border-left: 2px solid #555; border-right: 2px solid #555;
            flex-shrink: 0;
        }
        .round-display { font-size: 11px; font-weight: bold; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: -2px; }
        .timer-display { font-size: 24px; font-weight: bold; font-family: 'Courier New', Courier, monospace; color: #ffffff; }

        /* TARJA INFERIOR MENOR: Peso da Categoria (Fundo cinza escuro/preto) */
        .weight-bar {
            height: 24px; background: #1a1a1a; border: 2px solid #333;
            color: #ffcc00; font-size: 12px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            text-transform: uppercase; letter-spacing: 2px; font-style: italic;
        }
    </style>
</head>
<body>

    <div class="ufc-scoreboard">
        <!-- BARRA DE CIMA (DADOS DOS ATLETAS E TEMPO) -->
        <div class="main-bar">
            <!-- LUTADOR ESQUERDA (CÓRNER 1) -->
            <div class="fighter-side left">
                <div id="view-name-1" class="fighter-name">LUTADOR A</div>
                <div id="view-corner-1" class="corner-color" style="background-color: #000000;"></div>
            </div>

            <!-- CRONÔMETRO CENTRAL -->
            <div class="center-block">
                <div id="view-round" class="round-display">ROUND 1</div>
                <div id="view-timer" class="timer-display">05:00</div>
            </div>

            <!-- LUTADOR DIREITA (CÓRNER 2) -->
            <div class="fighter-side right">
                <div id="view-name-2" class="fighter-name">LUTADOR B</div>
                <div id="view-corner-2" class="corner-color" style="background-color: #0022cc;"></div>
            </div>
        </div>

        <!-- TARJA DE BAIXO (PESO DA CATEGORIA) -->
        <div id="view-weight" class="weight-bar">PESO MOSCA</div>
    </div>

    <script>
        const bc = new BroadcastChannel('fight_global_scoreboard');

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        bc.onmessage = (event) => {
            const data = event.data;
            document.getElementById('view-round').innerText = `ROUND ${data.round}`;
            document.getElementById('view-timer').innerText = formatTime(data.timeLeft);
            document.getElementById('view-weight').innerText = data.weight;
            
            // Atualiza atletas e córneres
            document.getElementById('view-name-1').innerText = data.name1;
            document.getElementById('view-corner-1').style.backgroundColor = data.color1;
            document.getElementById('view-name-2').innerText = data.name2;
            document.getElementById('view-corner-2').style.backgroundColor = data.color2;
        };
    </script>
</body>
</html>
