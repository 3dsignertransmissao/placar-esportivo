<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle - Tênis de Mesa</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #202020; color: #fff; padding: 15px; font-size: 14px; margin: 0; box-sizing: border-box; }
        .control-panel { width: 100%; }
        .control-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .control-col { flex: 1; display: flex; flex-direction: column; gap: 5px; background: #2d2d2d; padding: 10px; border-radius: 6px; }
        input[type="text"] { background: #444; border: 1px solid #555; color: white; padding: 6px; border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .score-actions { display: flex; gap: 5px; align-items: center; justify-content: center; margin-top: 5px; }
        button { background: #0066cc; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0052a3; }
        button.minus { background: #cc3333; }
        button.minus:hover { background: #b32424; }
        button.reset { background: #555; width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; }
        button.reset:hover { background: #444; }
        .control-display { font-size: 24px; font-weight: bold; text-align: center; margin: 5px 0; color: #00ffcc; }
        .control-display span { color: #ffcc00; font-size: 18px; margin-left: 5px; }
        button.btn-serve { background: #444; border: 2px solid #555; width: 100%; margin-top: 5px; color: #aaa; padding: 6px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button.btn-serve.serving { background: #ffcc00; color: #000; border-color: #ffcc00; }
        .shortcuts-info { background: #151515; padding: 8px; border-radius: 4px; margin-top: 10px; font-size: 11px; color: #aaa; border-left: 3px solid #0066cc; }
    </style>
</head>
<body>
    <div class="control-panel">
        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:4px; font-weight:bold;">Categoria / Etapa:</label>
            <input type="text" id="ctrl-category" value="CAT ABSOLUTO F MASCULINO" oninput="updateData()">
        </div>
        <div class="control-row">
            <!-- JOGADOR 1 (CIMA) -->
            <div class="control-col">
                <input type="text" id="ctrl-name-1" value="Jogador 1" oninput="updateData()">
                <button id="btn-serve-1" class="btn-serve serving" onclick="setServer(1)">Sacando</button>
                <div class="control-display"><span id="ctrl-lbl-sets-1">(0)</span> <span id="ctrl-lbl-points-1">0</span></div>
                <div class="score-actions">
                    <button class="minus" onclick="changeValue('pts1', -1)">-</button>
                    <button onclick="changeValue('pts1', 1)">+ Pts (F1)</button>
                </div>
                <div class="score-actions">
                    <button class="minus" onclick="changeValue('sets1', -1)">- Set</button>
                    <button onclick="changeValue('sets1', 1)">+ Set</button>
                </div>
            </div>
            <!-- JOGADOR 2 (BAIXO) -->
            <div class="control-col">
                <input type="text" id="ctrl-name-2" value="Jogador 2" oninput="updateData()">
                <button id="btn-serve-2" class="btn-serve" onclick="setServer(2)">Saca</button>
                <div class="control-display"><span id="ctrl-lbl-points-2">0</span> <span id="ctrl-lbl-sets-2">(0)</span></div>
                <div class="score-actions">
                    <button onclick="changeValue('pts2', 1)">+ Pts (F2)</button>
                    <button class="minus" onclick="changeValue('pts2', -1)">-</button>
                </div>
                <div class="score-actions">
                    <button onclick="changeValue('sets2', 1)">+ Set</button>
                    <button class="minus" onclick="changeValue('sets2', -1)">- Set</button>
                </div>
            </div>
        </div>
        <button class="reset" onclick="resetScoreboard()">Zerar Placar Completo (R)</button>
        <div class="shortcuts-info">
            <strong>Atalhos (Clique no painel antes de usar):</strong><br>
            • <strong>F1</strong>: +1 Ponto Jogador 1 (Cima) | • <strong>F2</strong>: +1 Ponto Jogador 2 (Baixo)<br>
            • <strong>F3</strong>: Alternar Saque | • <strong>R</strong>: Zerar Placar Geral
        </div>
    </div>
    <script>
        let state = { category: "CAT ABSOLUTO F MASCULINO", name1: "Jogador 1", name2: "Jogador 2", pts1: 0, pts2: 0, sets1: 0, sets2: 0, server: 1 };
        const bc = new BroadcastChannel('tm_global_scoreboard');
        function updateData() {
            state.category = document.getElementById('ctrl-category').value;
            state.name1 = document.getElementById('ctrl-name-1').value;
            state.name2 = document.getElementById('ctrl-name-2').value;
            document.getElementById('ctrl-lbl-points-1').innerText = state.pts1;
            document.getElementById('ctrl-lbl-points-2').innerText = state.pts2;
            document.getElementById('ctrl-lbl-sets-1').innerText = `(${state.sets1})`;
            document.getElementById('ctrl-lbl-sets-2').innerText = `(${state.sets2})`;
            document.getElementById('btn-serve-1').className = 'btn-serve' + (state.server === 1 ? ' serving' : '');
            document.getElementById('btn-serve-2').className = 'btn-serve' + (state.server === 2 ? ' serving' : '');
            document.getElementById('btn-serve-1').innerText = state.server === 1 ? 'Sacando' : 'Saca';
            document.getElementById('btn-serve-2').innerText = state.server === 2 ? 'Sacando' : 'Saca';
            bc.postMessage(state);
        }
        function changeValue(field, amount) { state[field] = Math.max(0, state[field] + amount); updateData(); }
        function setServer(playerNum) { state.server = playerNum; updateData(); }
        function resetScoreboard() { state.pts1 = 0; state.pts2 = 0; state.sets1 = 0; state.sets2 = 0; state.server = 1; updateData(); }
        window.addEventListener('keydown', function(event) {
            if (document.activeElement.tagName === 'INPUT') return;
            if (event.key === 'F1') { event.preventDefault(); changeValue('pts1', 1); }
            else if (event.key === 'F2') { event.preventDefault(); changeValue('pts2', 1); }
            else if (event.key === 'F3') { event.preventDefault(); setServer(state.server === 1 ? 2 : 1); }
            else if (event.key === 'r' || event.key === 'R') { resetScoreboard(); }
        });
        setTimeout(updateData, 300);
    </script>
    <!-- BLOCO DE APOIO COM QR CODE -->
    <div style="background: #151515; padding: 10px; margin-top: 15px; border-radius: 6px; text-align: center; border: 1px dashed #555;">
        <span style="font-weight: bold; font-size: 11px; color: #ffcc00; display: block; margin-bottom: 5px;">☕ APOIE ESTE PROJETO VIA PIX</span>
        <img src="pix.png" style="width: 100px; height: 100px; background: #fff; padding: 4px; border-radius: 4px; display: block; margin: 0 auto 5px auto;" alt="QR Code Pix">
        <span style="font-size: 10px; color: #aaa; display: block;">Escaneie o QR Code acima ou use a chave na descrição do GitHub para pagar um café ao desenvolvedor!</span>
    </div>
</body>
</html>
