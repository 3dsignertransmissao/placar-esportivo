<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle MMA / UFC</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #202020; color: #fff; padding: 12px; margin: 0; font-size: 13px; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .col { flex: 1; background: #2d2d2d; padding: 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
        input[type="text"], select { background: #444; border: 1px solid #555; color: white; padding: 5px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .btn-group { display: flex; gap: 4px; justify-content: center; }
        button { background: #0066cc; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0052a3; }
        button.minus { background: #cc3333; }
        button.minus:hover { background: #b32424; }
        .timer-panel { background: #151515; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 10px; border: 1px solid #444; }
        .timer-display { font-size: 26px; font-weight: bold; font-family: monospace; color: #ffffff; margin-bottom: 6px; }
        .section-title { font-size: 11px; font-weight: bold; color: #aaa; text-align: center; margin-top: 2px; text-transform: uppercase; }
        .shortcuts-info { background: #151515; padding: 6px; border-radius: 4px; margin-top: 5px; font-size: 11px; color: #aaa; text-align: center; }
    </style>
</head>
<body>

    <!-- CRONÔMETRO, ROUND E CATEGORIA DE PESO -->
    <div class="timer-panel">
        <div style="display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom: 8px;">
            <span style="font-weight:bold;">ROUND:</span>
            <span id="lbl-round" style="font-size:16px; font-weight:bold; color:#ffcc00;">1</span>
            <button class="minus" onclick="changeRound(-1)">-</button>
            <button onclick="changeRound(1)">+</button>
        </div>
        
        <div style="margin-bottom: 8px;">
            <label style="font-size:11px; font-weight:bold; color:#aaa; display:block; margin-bottom:2px;">CATEGORIA DE PESO:</label>
            <input type="text" id="ctrl-weight" value="PESO MOSCA" oninput="updateData()" style="text-align: center; font-weight: bold;">
        </div>

        <div id="ctrl-timer-lbl" class="timer-display">05:00</div>
        <div class="btn-group">
            <button onclick="toggleTimer()" id="btn-start" style="background:#28a745;">Iniciar</button>
            <button onclick="resetTimer()" style="background:#6c757d;">Zerar Tempo</button>
            <select id="ctrl-time-set" onchange="setTimePreset(this.value)" style="width: auto; display: inline-block;">
                <option value="300">5 min (Oficial)</option>
                <option value="180">3 min</option>
                <option value="60">1 min (Teste)</option>
            </select>
        </div>
        <div class="shortcuts-info">Dica: Clique no painel e use a <strong>Barra de Espaço</strong> para Play/Pause.</div>
    </div>

    <div class="row">
        <!-- LUTADOR ESQUERDA (CÓRNER 1) -->
        <div class="col">
            <div class="section-title">Lutador Esquerda</div>
            <input type="text" id="ctrl-name-1" value="A. FIGUEIREDO - AM" oninput="updateData()">
            <select id="ctrl-color-1" onchange="updateData()">
                <option value="#000000" selected>Preto (Black)</option>
                <option value="#ffffff">Branco (White)</option>
                <option value="#cc3333">Vermelho (Red)</option>
                <option value="#0022cc">Azul (Blue)</option>
            </select>
        </div>

        <!-- LUTADOR DIREITA (CÓRNER 2) -->
        <div class="col">
            <div class="section-title">Lutador Direita</div>
            <input type="text" id="ctrl-name-2" value="LUTADOR B" oninput="updateData()">
            <select id="ctrl-color-2" onchange="updateData()">
                <option value="#0022cc" selected>Azul (Blue)</option>
                <option value="#000000">Preto (Black)</option>
                <option value="#ffffff">Branco (White)</option>
                <option value="#cc3333">Vermelho (Red)</option>
            </select>
        </div>
    </div>
    <button onclick="resetAll()" style="background:#555; width:100%; padding:8px; border:none; border-radius:4px; color:#fff; font-weight:bold; cursor:pointer; margin-top:5px;">Zerar Todo o Placar</button>

    <script>
        let state = { round: 1, weight: "PESO MOSCA", name1: "A. FIGUEIREDO - AM", color1: "#000000", name2: "LUTADOR B", color2: "#0022cc", timeLeft: 300 };
        const bc = new BroadcastChannel('fight_global_scoreboard');
        let timerInterval = null;

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateData() {
            state.weight = document.getElementById('ctrl-weight').value;
            state.name1 = document.getElementById('ctrl-name-1').value;
            state.color1 = document.getElementById('ctrl-color-1').value;
            state.name2 = document.getElementById('ctrl-name-2').value;
            state.color2 = document.getElementById('ctrl-color-2').value;
            
            document.getElementById('lbl-round').innerText = state.round;
            document.getElementById('ctrl-timer-lbl').innerText = formatTime(state.timeLeft);

            bc.postMessage(state);
        }

        function changeRound(amount) {
            state.round = Math.max(1, state.round + amount);
            updateData();
        }

        function setTimePreset(seconds) {
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('btn-start').innerText = "Iniciar";
            document.getElementById('btn-start').style.background = "#28a745";
            state.timeLeft = parseInt(seconds);
            updateData();
        }

        function toggleTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                document.getElementById('btn-start').innerText = "Iniciar";
                document.getElementById('btn-start').style.background = "#28a745";
            } else {
                document.getElementById('btn-start').innerText = "Pausar";
                document.getElementById('btn-start').style.background = "#ffc107";
                timerInterval = setInterval(() => {
                    if (state.timeLeft > 0) {
                        state.timeLeft--;
                        updateData();
                    } else {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        document.getElementById('btn-start').innerText = "Iniciar";
                        document.getElementById('btn-start').style.background = "#28a745";
                    }
                }, 1000);
            }
        }

        window.addEventListener('keydown', function(event) {
            if (document.activeElement.tagName === 'INPUT') return;
            if (event.code === 'Space') {
                event.preventDefault();
                toggleTimer();
            }
        });

        function resetTimer() {
            setTimePreset(document.getElementById('ctrl-time-set').value);
        }

        function resetAll() {
            state.round = 1;
            resetTimer();
        }

        setTimeout(updateData, 300);
    </script>
</body>
</html>
